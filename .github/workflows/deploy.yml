name: Deploy to GitHub Pages
# name of the workflow

on:
  push:
    branches: [main]
# occurs or is "on" when a push is made to the main branch

permissions:
  contents: read
  pages: write
  id-token: write
# permissions to only give specific access: can only read the repo, write to pages, and write to id-token (used for authentication)

jobs:
  # only one job called build
  build:
    runs-on: ubuntu-latest
    # runs on the latest version of ubuntu image

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # first step called Checkout, making the files available to the runner
        # on version 4 of the checkout action

      - name: Setup Node
        uses: actions/setup-node@v4
        # run setup node which installs and runs it, "with" defining parameters for the action
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          # install and run node version 20
          #cache npm dependencies for faster builds and cache dependencies from package-lock.json file

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        # install dependencies using npm ci from the "frontend" folder

      - name: Build
        working-directory: frontend
        run: npm run build
        # build the project using npm run build from the "frontend" folder

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # necessary for deploying to GitHub Pages, sets up the environment for deployment

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
        # uploads the built file in "dist" folder as the "artifact" to be deployed

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # id is just a unique identifier for the step, allows for referencing the step in later steps